name: Build Android test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify SDK and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            example/android/**/*.gradle*
            example/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.3
          cache: true
          pub-cache: true

      - name: Resolve SDK dependencies
        run: flutter pub get

      - name: Verify SDK formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze SDK
        run: flutter analyze --no-pub

      - name: Test SDK
        run: flutter test --no-pub

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Verify example formatting
        working-directory: example
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze example
        working-directory: example
        run: flutter analyze --no-pub

      - name: Test example
        working-directory: example
        run: flutter test --no-pub

      - name: Build installable debug APK
        working-directory: example
        run: flutter build apk --debug --no-pub

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: hindatech-kyc-example-debug-${{ github.run_number }}
          path: example/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
